<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Komoku — connexion</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232a78d6'/><rect x='3' y='4.5' width='10' height='6' rx='1' fill='white'/><rect x='5.5' y='11.5' width='5' height='1' rx='.5' fill='white'/></svg>">
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 20px; }

  .login {
    width: min(380px, 100%);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px;
    box-shadow: var(--shadow);
  }

  .login h1 { font-size: 20px; font-weight: 650; margin: 0 0 4px; letter-spacing: -.01em; }
  .login p.lead { margin: 0 0 20px; color: var(--text-muted); font-size: 13px; }
  .login label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; }

  .login input {
    width: 100%;
    padding: 9px 11px;
    background: var(--surface-0);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
  }

  .login button[type="submit"] {
    width: 100%;
    padding: 9px;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: var(--radius-sm);
    font-weight: 560;
  }

  .login button[type="submit"]:disabled { opacity: .6; cursor: progress; }

  .err {
    display: none;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--critical);
    background: color-mix(in srgb, var(--critical) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--critical) 32%, transparent);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    margin-bottom: 14px;
  }

  .err.on { display: flex; }
</style>
</head>
<body>

<form class="login" id="form">
  <h1>Komoku</h1>
  <p class="lead">Tableau de bord du parc informatique.</p>

  <p class="err" id="err" role="alert"></p>

  <label for="pw">Mot de passe</label>
  <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>

  <button type="submit" id="go">Se connecter</button>
</form>

<script>
  const form = document.getElementById('form');
  const err = document.getElementById('err');
  const go = document.getElementById('go');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('on');
    go.disabled = true;
    go.textContent = 'Connexion…';
    try {
      const res = await fetch('api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }),
      });
      if (res.ok) {
        window.location.replace('./');
        return;
      }
      const data = await res.json().catch(() => ({}));
      err.textContent = data.error || 'Connexion refusée.';
      err.classList.add('on');
    } catch {
      err.textContent = 'Serveur injoignable.';
      err.classList.add('on');
    }
    go.disabled = false;
    go.textContent = 'Se connecter';
    document.getElementById('pw').select();
  });
</script>
</body>
</html>
